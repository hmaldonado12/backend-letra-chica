# HTTP Configuration for development (enabled for ngrok testing)
server.port=${PORT:8080}
server.address=0.0.0.0
server.ssl.enabled=false
spring.application.name=letra_chica

# CORS configuration - allow localhost and your local IP for development  
mobile.host=${MOBILE_HOST:https://192.168.0.59:8100}

google.identity.api.key={{google.identity.api.key}}
google.gemini.api.key={{google.gemini.api.key}}
google.url.auth=https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=

# Logging config
logging.level.root=INFO
logging.level.com.app.letrachica=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

spring.datasource.url=jdbc:h2:mem:letrachica;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
spring.jpa.hibernate.ddl-auto=update

